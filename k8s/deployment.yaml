apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-service-api
  labels:
    app: cloud-service-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cloud-service-api
  template:
    metadata:
      labels:
        app: cloud-service-api
    spec:
      containers:
      - name: cloud-api
        image: public.ecr.aws/srikhyathi/cloud-service-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-service-api
spec:
  type: ClusterIP
  selector:
    app: cloud-service-api
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
